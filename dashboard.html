<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Monthly summary for Personal Finance Tracker">
    <title>Dashboard - Personal Finance Tracker</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header>
        <h1>Personal Finance Tracker</h1>
        <nav>
            <a href="dashboard.html">Dashboard</a>
            <a href="transactions.html">Transactions</a>
            <a href="login.html">Log out</a>
        </nav>
    </header>

    <main class="wide">
        <h2>October Summary</h2>

        <div class="cards">
            <div class="card">
                <h3>Total Income</h3>
                <p class="amount income">$2,400.00</p>
            </div>
            <div class="card">
                <h3>Total Expenses</h3>
                <p class="amount expense">$1,375.50</p>
            </div>
            <div class="card">
                <h3>Balance</h3>
                <p class="amount">$1,024.50</p>
            </div>
        </div>

        <h3>Spending by Category</h3>
        <div class="chart-box">
            <canvas id="spending-chart"></canvas>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Srijan Pant</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
